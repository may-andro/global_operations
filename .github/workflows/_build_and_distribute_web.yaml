name: Host PWA to firebase

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      channelId:
        type: string
        required: true
      app_path:
        type: string
        required: true
    secrets:
      FIREBASE_OPTIONS_BASE64:
        required: true
      APP_CHECK_TOKEN_BASE64:
        required: true
      FIREBASE_SERVICE_ACCOUNT:
        required: true
      FIREBASE_PROJECT_ID:
        required: true
      FIREBASE_JSON_BASE64:
        required: true
      FIREBASE_CONFIG_BASE64:
        required: true

env:
  FLUTTER_VERSION: 3.32.2

jobs:
  build_and_host:
    name: Deploy web for ${{ inputs.app_path }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup the flutter environment
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          channel: stable
          cache: true

      - name: Set version from tag
        run: |
          pubspec_path="${{ inputs.app_path }}/pubspec.yaml"
          if [ "$GITHUB_REF_TYPE" != "tag" ]
          then
            echo "Ref name $GITHUB_REF_NAME is not a tag but a $GITHUB_REF_TYPE, not setting version number"
          else
            version=$(echo $GITHUB_REF_NAME | sed "s/-review//" | sed "s/-prod//") && sed -i "s/^version: .*$/version: $version/g" "$pubspec_path"
          fi

      - name: Decode Firebase Json
        run: |
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json

      - name: Decode firebase-config.js in web directory
        run: |
          mkdir -p ${{ github.workspace }}/${{ inputs.app_path }}/web
          echo "${{ secrets.FIREBASE_CONFIG_BASE64 }}" | base64 --decode > ${{ github.workspace }}/${{ inputs.app_path }}/web/firebase-config.js

      - name: Decode Firebase Options
        run: |
          mkdir -p ${{ github.workspace }}/${{ inputs.app_path }}/lib/firebase
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > ${{ github.workspace }}/${{ inputs.app_path }}/lib/firebase/firebase_options.dart

      - name: Decode App Check Token
        run: |
          mkdir -p ${{ github.workspace }}/layer/firebase/lib/src/app_check
          echo "${{ secrets.APP_CHECK_TOKEN_BASE64 }}" | base64 --decode > ${{ github.workspace }}/layer/firebase/lib/src/app_check/token.dart

      - name: Setup Melos
        run: |
          dart pub global activate melos

      - name: Get dart dependencies
        run: flutter pub get

      - name: Run code generator
        run: melos gen_app --no-select

      - name: Build Flutter Web
        working-directory: ${{ inputs.app_path }}
        run: flutter build web --release --dart-define=build_env=prod

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ github.token }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ inputs.channelId }}