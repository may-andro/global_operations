name: fb_add_scrapper web hosting and Android release to store

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - '*-fb_add_scrapper-prod'

permissions: write-all

jobs:
  build_release_notes:
    uses: ./.github/workflows/_build_release_notes.yaml
    with:
      preRelease: false

  code_quality_validation:
    uses: ./.github/workflows/_app_static_analyze_with_test.yaml
    with:
      app_path: 'app/fb_add_scrapper'
      app_name: 'fb_add_scrapper'
    secrets:
      FIREBASE_OPTIONS_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_OPTIONS_BASE64 }}
      APP_CHECK_TOKEN_BASE64: ${{ secrets.APP_CHECK_TOKEN_BASE64 }}

  web_build_and_distribute_release_candidate:
    uses: ./.github/workflows/_build_and_distribute_web.yaml
    needs: [code_quality_validation]
    with:
      channelId: 'live'
      app_path: 'app/fb_add_scrapper'
    secrets:
      FIREBASE_OPTIONS_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_OPTIONS_BASE64 }}
      APP_CHECK_TOKEN_BASE64: ${{ secrets.APP_CHECK_TOKEN_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_PROJECT_ID }}
      FIREBASE_JSON_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_JSON_BASE64 }}
      FIREBASE_CONFIG_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_CONFIG_BASE64 }}

  android_build_and_distribute_release_candidate:
    uses: ./.github/workflows/_build_and_distribute_android.yaml
    needs: [code_quality_validation]
    with:
      upload_to_github: 'false'
      upload_to_firebase: 'true'
      upload_to_play_store: 'true'
      app_path: 'app/fb_add_scrapper'
      android_package_name: 'com.global.fbaddscrapper'
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.FB_ADD_SCRAPPER_SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.FB_ADD_SCRAPPER_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.FB_ADD_SCRAPPER_SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.FB_ADD_SCRAPPER_SIGNING_STORE_PASSWORD }}
      APP_CHECK_TOKEN_BASE64: ${{ secrets.APP_CHECK_TOKEN_BASE64 }}
      FIREBASE_APP_ID: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_ANDROID_APP_ID }}
      FIREBASE_JSON_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_JSON_BASE64 }}
      FIREBASE_OPTIONS_BASE64: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_OPTIONS_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FB_ADD_SCRAPPER_FIREBASE_SERVICE_ACCOUNT }}
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.FB_ADD_SCRAPPER_PLAYSTORE_SERVICE_ACCOUNT }}
      GOOGLE_SERVICES_BASE64: ${{ secrets.FB_ADD_SCRAPPER_GOOGLE_SERVICES_BASE64 }}
      ANDROID_GOOGLE_MAP_KEY: ${{ secrets.FB_ADD_SCRAPPER_ANDROID_GOOGLE_MAP_KEY }}

