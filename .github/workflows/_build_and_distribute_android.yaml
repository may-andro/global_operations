name: Build and upload android artifacts

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      upload_to_github:
        type: string
        required: true
      upload_to_firebase:
        type: string
        required: true
      upload_to_play_store:
        type: string
        required: true
      app_path:
        type: string
        required: true
      android_package_name:
        type: string
        required: true
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: true
      SIGNING_KEY_ALIAS:
        required: true
      SIGNING_KEY_PASSWORD:
        required: true
      SIGNING_STORE_PASSWORD:
        required: true
      APP_CHECK_TOKEN_BASE64:
        required: true
      FIREBASE_APP_ID:
        required: true
      FIREBASE_JSON_BASE64:
        required: true
      FIREBASE_OPTIONS_BASE64:
        required: true
      FIREBASE_SERVICE_ACCOUNT:
        required: true
      PLAYSTORE_SERVICE_ACCOUNT:
        required: true
      GOOGLE_SERVICES_BASE64:
        required: true
      ANDROID_GOOGLE_MAP_KEY:
        required: true

env:
  FLUTTER_VERSION: 3.32.2
  JAVA_VERSION: "17"

jobs:
  create_release_artifact:
    name: Build Android artifacts for ${{ inputs.android_package_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{env.JAVA_VERSION}}
          cache: 'gradle'

      - name: Setup the flutter environment
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          channel: stable
          cache: true

      - name: Decode Firebase Json
        run: |
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json

      - name: Decode Firebase Options
        run: |
          mkdir -p ${{ github.workspace }}/${{ inputs.app_path }}/lib/firebase
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > ${{ github.workspace }}/${{ inputs.app_path }}/lib/firebase/firebase_options.dart

      - name: Decode App Check Token
        run: |
          mkdir -p ${{ github.workspace }}/layer/firebase/lib/src/app_check
          echo "${{ secrets.APP_CHECK_TOKEN_BASE64 }}" | base64 --decode > ${{ github.workspace }}/layer/firebase/lib/src/app_check/token.dart

      - name: Add Google Services in android directory
        run: |
          mkdir -p ${{ github.workspace }}/${{ inputs.app_path }}/android/app
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > ${{ github.workspace }}/${{ inputs.app_path }}/android/app/google-services.json

      - name: Create signing directory
        run: mkdir -p ${{ inputs.app_path }}/android/app/.signing

      - name: Decoding base64 key into a file
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ inputs.app_path }}/android/app/.signing/keystore.jks

      - name: Create the key.properties
        run: |
          properties_path="${{ inputs.app_path }}/android/key.properties"
          mkdir -p "$(dirname "$properties_path")"
          echo "storeFile=.signing/keystore.jks" > "$properties_path"
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$properties_path"
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$properties_path"
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$properties_path"

      - name: Create the local.properties
        run: |
          local_properties_path="${{ inputs.app_path }}/android/local.properties"
          mkdir -p "$(dirname "$local_properties_path")"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$local_properties_path"
          echo "googleMapsApiKey=${{ secrets.ANDROID_GOOGLE_MAP_KEY }}" >> "$local_properties_path"

      - name: Extract version and build name from tag
        run: |
          pubspec_path="${{ inputs.app_path }}/pubspec.yaml"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Ref name $GITHUB_REF_NAME is not a tag but a $GITHUB_REF_TYPE, not setting version and build name"
          else
            version=$(echo $GITHUB_REF_NAME | sed "s/-review//" | sed "s/-prod//") && sed -i "s/^version: .*$/version: $version/g" "$pubspec_path"
            build_name=$(echo $GITHUB_REF_NAME | sed -E 's/.*\+([0-9]+).*/\1/')
            echo "Extracted version: $version"
            echo "Extracted build name: $build_name"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          fi
        id: extract_version_and_build_name

      - name: Update pubspec.yaml with extracted version
        run: |
          pubspec_path="${{ inputs.app_path }}/pubspec.yaml"
          if [ -n "${{ steps.extract_version_and_build_name.outputs.version }}" ]; then
            sed -i "s/^version: .*$/version: ${{ steps.extract_version_and_build_name.outputs.version }}/g" "$pubspec_path"
          fi

      - name: Setup Melos
        run: |
          dart pub global activate melos

      - name: Run code generator
        run: melos gen --no-select

      - name: Generate icons
        run: melos gen_icon

      - name: Build apk file
        working-directory: ${{ inputs.app_path }}
        run: flutter build apk --dart-define=build_env=prod --build-name=${{ steps.extract_version_and_build_name.outputs.build_name }}
        timeout-minutes: 20

      - name: Build aab file
        working-directory: ${{ inputs.app_path }}
        run: flutter build appbundle --dart-define=build_env=prod

      - name: Upload APK artifact to Github
        uses: actions/upload-artifact@v4
        if: inputs.upload_to_github == 'true'
        with:
          name: ${{ inputs.android_package_name }}-release.apk
          path: ${{ inputs.app_path }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact to Github
        uses: actions/upload-artifact@v4
        if: inputs.upload_to_github == 'true'
        with:
          name: ${{ inputs.android_package_name }}-release.aab
          path: ${{ inputs.app_path }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        if: inputs.upload_to_firebase == 'true'
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.upload_to_play_store == 'true' && 'release_review' || 'review' }}
          file: ${{ inputs.app_path }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB to Play Store
        if: inputs.upload_to_play_store == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
          packageName: ${{ inputs.android_package_name }}
          releaseFiles: ${{ inputs.app_path }}/build/app/outputs/bundle/release/app-release.aab
          track: alpha





