name: global_ops_workspace
description: "Global Ops workspace root"
publish_to: 'none'

environment:
  sdk: ^3.8.1

# Dart pub workspace – single pubspec.lock for the whole repo.
workspace:
  - app/global_ops
  - app/fb_add_scrapper
  - layer/cache
  - layer/core
  - layer/design_system
  - layer/error_reporter
  - layer/firebase
  - layer/log_reporter
  - layer/module_injector
  - layer/remote
  - layer/tracking
  - layer/use_case
  - tool/firebase/firestore_export_import

dev_dependencies:
  custom_lint: ^0.8.0
  melos: ^7.1.1

melos:
  command:
    bootstrap:
      environment:
        sdk: ^3.8.1
      dependencies:
        collection: ^1.19.1
        equatable: ^2.0.7
        intl: ^0.20.2
        json_annotation: ^4.9.0
        meta: ^1.17.0
        package_info_plus: ^8.3.1
      dev_dependencies:
        build_runner: ^2.6.0
        json_serializable: ^6.10.0
        mocktail: ^1.0.4
        test: ^1.24.9
    clean:
      hooks:
        post: melos exec --flutter --concurrency=1 -- "flutter clean"
  scripts:
    # Quality scripts
    format_check:
      run: melos exec -- dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.

    analyze:
      run: flutter analyze .
      description: Run `flutter analyze` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    analyze_fix:
      run: |
        dart fix --dry-run
        dart fix --apply
        dart format .
        flutter analyze
        flutter pub get
      description: Run `flutter analyze` and fix issues in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    version:
      run: flutter --version
      description: Run `flutter version` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    get:
      run: flutter pub get
      description: Run `flutter pub get` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    gen:
      run: dart run build_runner build --delete-conflicting-outputs
      description: Run `build_runner` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    upgrade:
      run: flutter pub upgrade
      description: Run `flutter pub upgrade` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    # Clean scripts
    cache_clean:
      run: |
        flutter clean
        flutter pub cache repair
        flutter pub get
      description: Clean cache.
      exec:
        concurrency: 1

    ios_clean:
      run: |
        cd app/global_ops
        rm -rf ios/Pods/*
        rm -f ios/Podfile.lock
        rm -r ios/.symlinks
        rm -rf ~/.pub-cache/hosted/pub.dartlang.org/
        rm -f ios/Flutter/Flutter.podspec
        flutter clean
        flutter pub get
        cd ios
        pod cache clean --all
        pod repo update
        cd ..
        flutter pub get
        cd ios
        pod install
      description: Clean iOS Pods and rebuild.

    # Test scripts
    test:
      run: flutter test --exclude-tags 'golden'
      description: Run `flutter test` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    update_golden_test:
      run: flutter test --tags golden --update-goldens
      description: Update `golden` test files in all packages.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: alchemist

    golden_test:
      run: flutter test --tags golden
      description: Run `golden` tests in all packages.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: alchemist

    golden_test_in_ci:
      run: flutter test --tags golden --dart-define=CI=true
      description: Run `golden` tests in all packages.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: alchemist

    # Generative scripts
    gen_splash:
      run: |
        flutter clean
        flutter pub get
        dart run flutter_native_splash:create --path=native_splash.yaml
      description: Generate splash screen for all flavors.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: flutter_native_splash

    gen_icon:
      run: |
        flutter pub run flutter_launcher_icons -f flutter_launcher_icons.yaml
      description: Generate icons for the app.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: flutter_launcher_icons

    gen_translations:
      run: |
        flutter gen-l10n
      description: Generate locale for the app.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: flutter_localizations

    # Run scripts (scoped to the app package)
    run_global_ops_prod:
      run: |
        cd app/global_ops
        flutter run lib/main.dart --dart-define=build_env=prod
      description: Run the global_ops app in prod env.
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    run_global_ops_prod_release:
      run: |
        cd app/global_ops
        flutter run lib/main.dart --dart-define=build_env=prod --release
      description: Run the global_ops app in prod env (release mode).
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    run_global_ops_prod_web_release:
      run: |
        cd app/global_ops
        flutter run lib/main.dart --dart-define=build_env=prod --release -d chrome --web-port=1234
      description: Run the global_ops app in prod env on Chrome (release mode).
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    run_global_ops_staging_web:
      run: |
        cd app/global_ops
        flutter run lib/main.dart --dart-define=build_env=staging -d chrome --web-port=1234
      description: Run the global_ops app in staging env on Chrome.
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    run_global_ops_staging:
      run: |
        cd app/global_ops
        flutter run lib/main.dart --dart-define=build_env=staging
      description: Run the global_ops app in staging env.
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    # Helper scripts
    module_checks:
      run: |
        flutter analyze
        dart fix --dry-run
        dart fix --apply
        dart format .
        flutter analyze
        flutter pub get
        flutter test --exclude-tags 'golden'
      description: Run analyze, fix, format, test a module.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    test_with_coverage:
      run: flutter test --exclude-tags golden --coverage --machine > test-results.json --no-pub
      description: Run all tests with coverage.
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    gen_app:
      run: dart run build_runner build --delete-conflicting-outputs
      description: Run `build_runner` in all packages.
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
        ignore:
          - storybook

    # Deploy scripts
    host_web:
      run: |
        echo "Clean existing repository"
        flutter clean
        echo "Getting packages"
        flutter pub get
        echo "Building web with Flutter"
        flutter build web --release --dart-define=build_env=prod
        echo "Deploying to Firebase"
        firebase deploy --only hosting --config=../../firebase.json
      description: Build and deploy Flutter web app.
      exec:
        concurrency: 1
      packageFilters:
        name: global_ops

    host_privacy_policy:
      run: |
        cd tool/privacy_policy
        echo "Deploying to Firebase"
        firebase deploy --only hosting:privacy-policy-19c96
      description: Deploy static privacy policy web page.

    host_terms_and_conditions:
      run: |
        cd tool/terms_and_condition
        echo "Deploying to Firebase"
        firebase deploy --only hosting:terms-and-condition-19c96
      description: Deploy static terms and conditions web page.

    host_functions:
      run: firebase deploy --only functions:snowflake_management
      description: Deploy Snowflake Management Cloud Functions.

    host_fb_ads_functions:
      run: firebase deploy --only functions:fb_ads_scraper
      description: Build and deploy FB Ads Scraper Cloud Functions (searchAds, getPageInfo) with FB_ADS_ACCESS_TOKEN secret.

